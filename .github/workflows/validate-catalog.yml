name: validate-catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    name: validate-catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4' 'pytest==8.4.2'
      - name: Validate draft 2020-12 metaschema
        run: python -c 'import json; from jsonschema import Draft202012Validator; Draft202012Validator.check_schema(json.load(open("catalog.schema.json", encoding="utf-8")))'
      - name: Validate catalog and publication policy
        run: python scripts/validate_catalog.py catalog.json
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      # Disabled signing placeholder: do not add a signing step until the owner
      # provisions a certificate, secure key custody and a reviewed signing job.
      # This catalog workflow neither builds nor signs Windows binaries.
